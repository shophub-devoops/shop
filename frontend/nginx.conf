server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA history fallback — client-side routes must hit index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to the backend service. The operator deploys backend and
    # frontend in the same namespace, so $upstream resolves via cluster DNS.
    location /api/ {
        proxy_pass http://shop-backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /probe/liveness {
        return 200 "ok\n";
    }
}
